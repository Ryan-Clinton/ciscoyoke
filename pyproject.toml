[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ciscoyoke"
version = "0.1.0.dev0"
description = "A rescue bench for old Cisco hardware — discover, diagnose, preserve and recover from the serial console, with no management IP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Ryan Clinton" }]
keywords = ["cisco", "serial", "console", "rommon", "recovery", "homelab", "ccna"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Recovery Tools",
]
dependencies = [
    "pyserial>=3.5",
    "platformdirs>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
ciscoyoke = "ciscoyoke.cli:main"

[project.urls]
Homepage = "https://github.com/Ryan-Clinton/ciscoyoke"
Specification = "https://github.com/Ryan-Clinton/ciscoyoke/blob/main/docs/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ciscoyoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/ciscoyoke"]

[[tool.mypy.overrides]]
module = ["serial.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
