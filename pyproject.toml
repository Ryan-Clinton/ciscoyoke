[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ciscoyoke"
version = "0.1.0a1"
description = "Rescue old Cisco hardware from the serial console: identify, preserve, recover and reset second-hand Catalysts and routers, with no management IP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Ryan Clinton" }]
keywords = ["cisco", "cisco-ios", "catalyst", "serial", "serial-console", "console", "rommon", "recovery", "password-recovery", "homelab", "ccna", "network-automation", "xmodem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Recovery Tools",
]
dependencies = [
    "pyserial>=3.5",
    "platformdirs>=4.0",
    "rich>=13.0",
]

# The embedded TFTP server is one image-delivery path among several. Without
# it, `--via xmodem` and an external server still work, so it is not a hard
# dependency and its absence is reported rather than fatal.

[project.optional-dependencies]
tftp = ["tftpy>=0.8"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "tftpy>=0.8",
]

[project.scripts]
ciscoyoke = "ciscoyoke.cli:main"

[project.urls]
Homepage = "https://github.com/Ryan-Clinton/ciscoyoke"
Specification = "https://github.com/Ryan-Clinton/ciscoyoke/blob/main/docs/SPEC.md"
Changelog = "https://github.com/Ryan-Clinton/ciscoyoke/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ryan-Clinton/ciscoyoke/issues"
"Hardware reports" = "https://github.com/Ryan-Clinton/ciscoyoke/issues/new?template=hardware-report.yml"

[tool.hatch.build.targets.wheel]
packages = ["src/ciscoyoke"]

# An allowlist, not the default "everything not gitignored": a local build once
# swept an untracked personal PDF from docs/ into the source archive. Only what
# is named here can reach PyPI.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs/ARCHITECTURE.md",
    "docs/DEVELOPMENT.md",
    "docs/HARDWARE-TESTING.md",
    "docs/SAFETY.md",
    "docs/SPEC.md",
    "docs/THREAT-MODEL.md",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/ciscoyoke"]

[[tool.mypy.overrides]]
module = ["serial.*", "tftpy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
