<!-- Source for docs/social-preview.png (1280x640, GitHub's social preview size).
     Rebuild: chrome --headless=new --window-size=1280,640 --screenshot=docs/social-preview.png docs/social-preview.html -->
<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; background: #0d1117; overflow: hidden; }
  body { display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 56px; padding: 0 80px; box-sizing: border-box;
         font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #e6edf3; }
  h1 { font: 700 84px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: -2px; margin: 0 0 28px; }
  p { font-size: 34px; line-height: 1.3; margin: 0 0 18px; color: #c9d1d9; }
  .small { font-size: 24px; color: #8b949e; margin-top: 30px; }
  .term { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 26px 30px 30px;
          font: 25px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .dots { display: flex; gap: 9px; margin-bottom: 18px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .dim { color: #8b949e; } .ok { color: #7ee787; } .warn { color: #f0883e; }
</style>
<div>
  <h1>ciscoyoke</h1>
  <p>Rescue old Cisco hardware<br>from the serial console.</p>
  <p class="small">locked · unknown · no IOS &nbsp;→&nbsp; clean lab device<br>no IP address needed</p>
</div>
<div class="term">
  <div class="dots"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></div>
  <div class="warn">Username:</div>
  <div class="dim">$ ciscoyoke recover access COM4</div>
  <div>switch: <span class="dim">flash_init</span></div>
  <div class="dim">rename config.text …</div>
  <div class="dim">  ⋮</div>
  <div class="ok">Switch#</div>
</div>
