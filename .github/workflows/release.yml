name: Release

# Publishing a tag like v0.1.0a1 builds the package, checks it, publishes it to
# PyPI through trusted publishing (no API token stored anywhere), and creates a
# GitHub release -- marked prerelease for any a/b/rc version.
#
# One-time setup, done by the maintainer on pypi.org before the first tag:
#   Account -> Publishing -> Add a pending publisher
#     project: ciscoyoke   owner: Ryan-Clinton   repo: ciscoyoke
#     workflow: release.yml   environment: pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        # A tag that disagrees with pyproject would publish one version under
        # another's name, and PyPI never lets a version number be reused.
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi

      - name: Test
        run: python -m pip install -e ".[dev]" && python -m pytest -q

      - name: Build
        run: python -m pip install build twine && python -m build && python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* $prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/Ryan-Clinton/ciscoyoke/blob/main/CHANGELOG.md). Install: \`pipx install ciscoyoke\`"
