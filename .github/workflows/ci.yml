name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The whole suite runs against recorded device behaviour, so no runner
    # needs a Cisco box attached. Windows is not optional here: the tool's
    # first-run command is `ciscoyoke doctor`, and a legacy console encoding
    # has already broken it once.
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        # tools/check.py is the same command a contributor runs locally.
        run: python tools/check.py test

      - name: Smoke test the CLI
        # Exercises the real entry point through the runner's actual console
        # encoding, which is what the captured-stdout unit tests cannot do.
        #
        # `ports` exits 10 (DEVICE_NOT_FOUND) on a runner with no serial
        # adapters, which is the documented contract rather than a fault -- so
        # the accepted codes are listed explicitly. Anything outside the list,
        # including a crash, still fails the build.
        shell: bash
        run: |
          set -u
          expect_code() {
            local allowed="$1"; shift
            set +e
            "$@" >/dev/null
            local code=$?
            set -e
            case " $allowed " in
              *" $code "*) echo "ok: $* -> $code" ;;
              *) echo "::error::$* exited $code, expected one of: $allowed"; exit 1 ;;
            esac
          }
          expect_code "0" ciscoyoke --version
          expect_code "0" ciscoyoke doctor
          expect_code "0 10" ciscoyoke --json ports
          expect_code "0 10" ciscoyoke --json scan
          expect_code "0" ciscoyoke ports labels

  install:
    # What a user actually does: `pipx install`, then the first-run commands.
    # The test job installs editable and discards the output, so it cannot
    # show that the built package works, or what `doctor` says on a Mac --
    # and nobody here owns one. Output is printed on purpose: read it in the
    # log. No runner has a console cable, so what `ports` and `doctor` make of
    # a real /dev/cu.* adapter still needs a person (issue #2).
    name: pipx install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip install --upgrade pip build pipx && python -m build --wheel

      - name: Install it with pipx
        shell: bash
        run: |
          python -m pipx install dist/*.whl
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: First-run commands
        shell: bash
        run: |
          set -u
          uname -a
          show() {
            local allowed="$1"; shift
            echo "::group::$*"
            set +e
            "$@"
            local code=$?
            set -e
            echo "::endgroup::"
            case " $allowed " in
              *" $code "*) echo "ok: $* -> $code" ;;
              *) echo "::error::$* exited $code, expected one of: $allowed"; exit 1 ;;
            esac
          }
          show "0" ciscoyoke --version
          show "0" ciscoyoke doctor
          show "0 10" ciscoyoke ports

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff and mypy
        run: python tools/check.py lint types

  fixtures:
    name: No raw transcripts committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse raw recordings
        # Raw .ytx files are private by definition and may contain a previous
        # owner's credentials. The schema already refuses to load one as a
        # fixture; this stops one reaching the repository at all, because a
        # secret committed to git history cannot be taken back.
        run: python3 tools/check.py fixtures
