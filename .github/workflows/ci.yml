name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The whole suite runs against recorded device behaviour, so no runner
    # needs a Cisco box attached. Windows is not optional here: the tool's
    # first-run command is `ciscoyoke doctor`, and a legacy console encoding
    # has already broken it once.
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Smoke test the CLI
        # Exercises the real entry point through the runner's actual console
        # encoding, which is what the captured-stdout unit tests cannot do.
        #
        # `ports` exits 10 (DEVICE_NOT_FOUND) on a runner with no serial
        # adapters, which is the documented contract rather than a fault -- so
        # the accepted codes are listed explicitly. Anything outside the list,
        # including a crash, still fails the build.
        shell: bash
        run: |
          set -u
          expect_code() {
            local allowed="$1"; shift
            set +e
            "$@" >/dev/null
            local code=$?
            set -e
            case " $allowed " in
              *" $code "*) echo "ok: $* -> $code" ;;
              *) echo "::error::$* exited $code, expected one of: $allowed"; exit 1 ;;
            esac
          }
          expect_code "0" ciscoyoke --version
          expect_code "0" ciscoyoke doctor
          expect_code "0 10" ciscoyoke --json ports
          expect_code "0 10" ciscoyoke --json scan
          expect_code "0" ciscoyoke ports labels

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy

  fixtures:
    name: No raw transcripts committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse raw recordings
        # Raw .ytx files are private by definition and may contain a previous
        # owner's credentials. The schema already refuses to load one as a
        # fixture; this stops one reaching the repository at all, because a
        # secret committed to git history cannot be taken back.
        run: |
          if git ls-files '*.ytx' | grep -v '\.ytx\.pub$' | grep . ; then
            echo "::error::raw .ytx transcripts must be scrubbed before committing"
            exit 1
          fi
          echo "no raw transcripts committed"
